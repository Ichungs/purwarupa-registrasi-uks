<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DompetKu — Expense Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<style>
  :root{
    --bg:#0f1117; --card:#181b25; --card2:#1f2330; --text:#f2f3f8; --text2:#8a8fa3;
    --line:#262a38; --accent:#6366f1; --accent2:#a855f7; --green:#22c55e; --red:#f43f5e;
    --yellow:#f59e0b; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#f2f4fb; --card:#ffffff; --card2:#f6f7fc; --text:#171a26; --text2:#6b7280;
    --line:#e7e8f0; --shadow:0 8px 24px rgba(80,90,150,.10);
  }
  :root[data-theme="dark"]{ color-scheme:dark; }
  :root[data-theme="light"]{ color-scheme:light; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh}
  .app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);animation:fadeUp .35s ease}
  h1,h2,h3{font-weight:700}
  .muted{color:var(--text2);font-size:.85rem}
  button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .logo{font-size:1.35rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .icon-btn{font-size:1.2rem;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line)}

  /* Month nav */
  .month-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
  .month-nav .label{font-weight:700;min-width:170px;text-align:center}
  .mn-btn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:1rem}
  .chip-today{font-size:.72rem;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}

  /* Summary */
  .balance-card{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;margin-bottom:12px}
  .balance-card .big{font-size:1.9rem;font-weight:800;letter-spacing:.5px;margin-top:4px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .stat .val{font-size:1.15rem;font-weight:800;margin-top:4px}
  .stat .val.green{color:var(--green)} .stat .val.red{color:var(--red)}
  .save-rate{margin-top:8px;font-size:.8rem;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);display:inline-block}

  /* Generic */
  .section-title{font-size:.95rem;font-weight:700;margin:18px 4px 10px;display:flex;justify-content:space-between;align-items:center}
  .avatar{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
  .list{display:flex;flex-direction:column;gap:8px}
  .row-item{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card2);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%;transition:.15s}
  .row-item:hover{transform:translateY(-1px);border-color:var(--accent)}
  .row-item .grow{flex:1;min-width:0}
  .row-item .t{font-weight:600;font-size:.92rem}
  .row-item .s{font-size:.76rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .amt{font-weight:800;font-size:.92rem;white-space:nowrap}
  .amt.in{color:var(--green)} .amt.out{color:var(--red)}
  .day-head{display:flex;justify-content:space-between;font-size:.78rem;color:var(--text2);margin:14px 4px 6px;font-weight:600}

  /* Charts */
  canvas{width:100%;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:.8rem}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* Bars (budget) */
  .bar{height:9px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
  .bar i.warn{background:linear-gradient(90deg,#f59e0b,#f97316)}
  .bar i.over{background:linear-gradient(90deg,#ef4444,#f43f5e)}
  .alert-chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:6px 12px;border-radius:99px;margin:4px 6px 0 0;font-weight:600}
  .alert-chip.over{background:rgba(244,63,94,.15);color:var(--red)}
  .alert-chip.warn{background:rgba(245,158,11,.15);color:var(--yellow)}

  /* Filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filters input,.filters select{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 12px;font-size:.85rem}

  /* Buttons */
  .btn{padding:11px 18px;border-radius:13px;font-weight:700;font-size:.9rem;transition:.15s}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:var(--card2);border:1px solid var(--line)}
  .btn-danger{background:rgba(244,63,94,.12);color:var(--red);border:1px solid rgba(244,63,94,.3)}
  .btn-sm{padding:7px 12px;font-size:.8rem;border-radius:10px}

  /* Nav + FAB */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50;max-width:560px;margin:0 auto}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.25rem;padding:6px 12px;border-radius:12px;color:var(--text2);min-width:60px}
  .nav-btn small{font-size:.62rem;font-weight:600}
  .nav-btn.active{color:var(--accent);background:var(--card2)}
  .fab{position:fixed;bottom:82px;right:max(20px,calc(50vw - 280px + 20px));width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:1.7rem;box-shadow:0 10px 25px rgba(99,102,241,.45);z-index:49;display:flex;align-items:center;justify-content:center;transition:.2s}
  .fab:hover{transform:scale(1.07) rotate(90deg)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .overlay.show{display:flex}
  .modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
  .modal h2{font-size:1.15rem;margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.78rem;font-weight:600;color:var(--text2);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:12px 14px;font-size:.95rem}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .amt-wrap{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:0 14px}
  .amt-wrap span{font-weight:800;color:var(--text2);margin-right:8px}
  .amt-wrap input{flex:1;background:none;border:none;color:var(--text);font-size:1.3rem;font-weight:800;padding:12px 0}
  .amt-wrap input:focus{outline:none}
  .quick{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .quick button{font-size:.75rem;padding:6px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:600}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card2);padding:5px;border-radius:14px;margin-bottom:14px}
  .seg button{padding:10px;border-radius:10px;font-weight:700;font-size:.88rem;color:var(--text2)}
  .seg button.active{background:var(--card);box-shadow:var(--shadow);color:var(--text)}
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:220px;overflow-y:auto}
  .cat-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:13px;background:var(--card2);border:2px solid transparent;font-size:.72rem;font-weight:600}
  .cat-chip .em{font-size:1.3rem}
  .cat-chip.sel{border-color:var(--accent);background:rgba(99,102,241,.12)}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions .btn{flex:1}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:32px;height:32px;border-radius:10px;border:3px solid transparent}
  .swatch.sel{border-color:var(--text);transform:scale(1.1)}
  .switch{position:relative;width:48px;height:27px;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:99px;transition:.2s}
  .slider:before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--text2);top:2.5px;left:3px;transition:.2s}
  .switch input:checked + .slider{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none}
  .switch input:checked + .slider:before{transform:translateX(21px);background:#fff}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}
  .set-row:last-child{border:none}

  /* Toast */
  #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 22px;border-radius:99px;font-weight:600;font-size:.85rem;opacity:0;pointer-events:none;transition:.3s;z-index:200;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%)}

  .tab{display:none} .tab.active{display:block}
  .empty{text-align:center;padding:38px 20px;color:var(--text2)}
  .empty .big-em{font-size:3rem;margin-bottom:10px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">💸 DompetKu</div>
    <button class="icon-btn" id="themeBtn" title="Ganti tema">🌙</button>
  </header>

  <div class="month-nav">
    <button class="mn-btn" id="prevM">‹</button>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="label" id="monthLabel"></span>
      <button class="chip-today" id="todayChip" style="display:none">Bulan ini</button>
    </div>
    <button class="mn-btn" id="nextM">›</button>
  </div>

  <main>
    <!-- ========== DASHBOARD ========== -->
    <section class="tab active" id="tab-home">
      <div id="homeContent"></div>
    </section>

    <!-- ========== TRANSAKSI ========== -->
    <section class="tab" id="tab-tx">
      <div class="filters">
        <input id="fSearch" placeholder="🔍 Cari catatan/kategori..." style="flex:2">
        <select id="fType"><option value="">Semua Tipe</option><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select>
        <select id="fCat"><option value="">Semua Kategori</option></select>
        <select id="fWallet"><option value="">Semua Dompet</option></select>
      </div>
      <div id="txList"></div>
    </section>

    <!-- ========== BUDGET ========== -->
    <section class="tab" id="tab-budget">
      <div id="budgetContent"></div>
    </section>

    <!-- ========== STATISTIK ========== -->
    <section class="tab" id="tab-stats">
      <div id="statsContent"></div>
    </section>

    <!-- ========== PENGATURAN ========== -->
    <section class="tab" id="tab-settings">
      <div id="settingsContent"></div>
    </section>
  </main>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="home">🏠<small>Beranda</small></button>
  <button class="nav-btn" data-tab="tx">📋<small>Transaksi</small></button>
  <button class="nav-btn" data-tab="budget">🎯<small>Budget</small></button>
  <button class="nav-btn" data-tab="stats">📈<small>Statistik</small></button>
  <button class="nav-btn" data-tab="settings">⚙️<small>Lainnya</small></button>
</nav>
<button class="fab" id="fabBtn">+</button>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" hidden>

<script>
'use strict';
/* ================= UTIL ================= */
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const fmtShort=n=>'Rp '+new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:1}).format(n);
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
const parseAmt=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
const fmtInput=v=>v?new Intl.NumberFormat('id-ID').format(v):'';

/* ================= DATA DEFAULT ================= */
const PALETTE=['#f97316','#f59e0b','#eab308','#22c55e','#14b8a6','#06b6d4','#38bdf8','#6366f1','#8b5cf6','#a855f7','#ec4899','#ef4444','#94a3b8'];
function defaultState(){return{
  theme:'dark',
  wallets:[
    {id:'cash',name:'Tunai',emoji:'💵',color:'#22c55e'},
    {id:'bank',name:'Bank',emoji:'🏦',color:'#6366f1'},
    {id:'ewallet',name:'E-Wallet',emoji:'📱',color:'#f59e0b'}
  ],
  cats:[
    {id:'food',name:'Makanan',emoji:'🍜',color:'#f97316',type:'out'},
    {id:'transport',name:'Transport',emoji:'🚗',color:'#38bdf8',type:'out'},
    {id:'shopping',name:'Belanja',emoji:'🛍️',color:'#ec4899',type:'out'},
    {id:'bills',name:'Tagihan',emoji:'🧾',color:'#eab308',type:'out'},
    {id:'fun',name:'Hiburan',emoji:'🎮',color:'#a855f7',type:'out'},
    {id:'health',name:'Kesehatan',emoji:'💊',color:'#ef4444',type:'out'},
    {id:'edu',name:'Pendidikan',emoji:'📚',color:'#6366f1',type:'out'},
    {id:'home',name:'Rumah',emoji:'🏠',color:'#14b8a6',type:'out'},
    {id:'family',name:'Keluarga',emoji:'👨‍👩‍👧',color:'#f43f5e',type:'out'},
    {id:'sport',name:'Olahraga',emoji:'🏋️',color:'#22c55e',type:'out'},
    {id:'other-out',name:'Lainnya',emoji:'📦',color:'#94a3b8',type:'out'},
    {id:'salary',name:'Gaji',emoji:'💼',color:'#22c55e',type:'in'},
    {id:'bonus',name:'Bonus',emoji:'🎁',color:'#f59e0b',type:'in'},
    {id:'biz',name:'Bisnis',emoji:'🏪',color:'#06b6d4',type:'in'},
    {id:'invest',name:'Investasi',emoji:'📈',color:'#8b5cf6',type:'in'},
    {id:'gift',name:'Hadiah',emoji:'🎀',color:'#ec4899',type:'in'},
    {id:'other-in',name:'Lainnya',emoji:'💰',color:'#94a3b8',type:'in'}
  ],
  budgets:{},
  txs:[]
};}
const LS='dompetku_v1';
let state=loadState();
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.txs&&s.wallets)return s;}catch(e){}return defaultState();}
function save(){localStorage.setItem(LS,JSON.stringify(state));}

/* ================= STATE UI ================= */
const now=new Date();
let cur={y:now.getFullYear(),m:now.getMonth()};
let activeTab='home', filters={q:'',type:'',cat:'',wallet:''}, confirmCb=null;
const curKey=()=>`${cur.y}-${pad(cur.m+1)}`;
const isCurMonth=()=>{const n=new Date();return cur.y===n.getFullYear()&&cur.m===n.getMonth();};
const catById=id=>state.cats.find(c=>c.id===id)||{name:'?',emoji:'❓',color:'#94a3b8'};
const walById=id=>state.wallets.find(w=>w.id===id)||{name:'?',emoji:'❓'};
const txsOfMonth=()=>state.txs.filter(t=>t.date.startsWith(curKey()));
const sum=t=>t.reduce((a,x)=>a+x.amount,0);

/* ================= TOAST & MODAL ================= */
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function openModal(html){$('#modalBox').innerHTML=html;$('#overlay').classList.add('show');}
function closeModal(){$('#overlay').classList.remove('show');}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function confirmBox(msg,cb){confirmCb=cb;openModal(`
  <h2>⚠️ Konfirmasi</h2>
  <p class="muted" style="margin-bottom:6px">${msg}</p>
  <div class="modal-actions">
    <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
    <button class="btn btn-danger" id="confirmYes">Ya, Lanjutkan</button>
  </div>`);
  $('#confirmYes').onclick=()=>{closeModal();confirmCb&&confirmCb();};
}

/* ================= NAV & BULAN ================= */
$$('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
  activeTab=b.dataset.tab;
  $$('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));
  $$('.tab').forEach(s=>s.classList.toggle('active',s.id==='tab-'+activeTab));
  if(activeTab==='home')requestAnimationFrame(drawCharts);
}));
function renderMonthNav(){
  $('#monthLabel').textContent=new Date(cur.y,cur.m,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  $('#todayChip').style.display=isCurMonth()?'none':'inline-block';
}
$('#prevM').onclick=()=>{cur.m--;if(cur.m<0){cur.m=11;cur.y--;}renderAll();};
$('#nextM').onclick=()=>{cur.m++;if(cur.m>11){cur.m=0;cur.y++;}renderAll();};
$('#todayChip').onclick=()=>{const n=new Date();cur={y:n.getFullYear(),m:n.getMonth()};renderAll();};
$('#fabBtn').onclick=()=>txModal();
$('#themeBtn').onclick=toggleTheme;
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();save();renderAll();}
function applyTheme(){document.documentElement.dataset.theme=state.theme;$('#themeBtn').textContent=state.theme==='dark'?'🌙':'☀️';}

/* ================= DASHBOARD ================= */
function renderHome(){
  const el=$('#homeContent');
  if(state.txs.length===0){
    el.innerHTML=`<div class="card empty">
      <div class="big-em">🪙</div>
      <h2>Belum ada transaksi</h2>
      <p class="muted" style="margin:8px 0 18px">Mulai catat keuanganmu, atau coba dengan data contoh dulu.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="txModal()">+ Tambah Transaksi</button>
        <button class="btn btn-ghost" onclick="loadSample()">✨ Muat Data Contoh</button>
      </div></div>`;
    return;
  }
  const txm=txsOfMonth();
  const inc=sum(txm.filter(t=>t.type==='in')), out=sum(txm.filter(t=>t.type==='out'));
  const allBal=sum(state.txs.filter(t=>t.type==='in'))-sum(state.txs.filter(t=>t.type==='out'));
  const rate=inc>0?Math.round((inc-out)/inc*100):0;

  // alert budget
  let alerts='';
  state.cats.filter(c=>c.type==='out').forEach(c=>{
    const b=state.budgets[c.id]||0; if(!b)return;
    const spent=sum(txm.filter(t=>t.type==='out'&&t.catId===c.id));
    const pct=spent/b*100;
    if(pct>=100)alerts+=`<span class="alert-chip over">${c.emoji} ${esc(c.name)} jebol (${Math.round(pct)}%)</span>`;
    else if(pct>=85)alerts+=`<span class="alert-chip warn">${c.emoji} ${esc(c.name)} ${Math.round(pct)}%</span>`;
  });

  const recent=[...txm].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,6);
  el.innerHTML=`
    <div class="card balance-card">
      <div style="font-size:.8rem;opacity:.85;font-weight:600">Total Saldo</div>
      <div class="big">${fmt(allBal)}</div>
      <span class="save-rate">💡 Hemat ${rate}% bulan ini</span>
    </div>
    <div class="duo">
      <div class="card stat"><div class="muted">📥 Pemasukan</div><div class="val green">${fmt(inc)}</div></div>
      <div class="card stat"><div class="muted">📤 Pengeluaran</div><div class="val red">${fmt(out)}</div></div>
    </div>

/* ================= CHARTS ================= */
function setupCanvas(c){const dpr=window.devicePixelRatio||1;const r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=(parseInt(c.getAttribute('height'))||200)*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);return{ctx,w:r.width,h:parseInt(c.getAttribute('height'))||200};}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function drawCharts(){drawDonut();drawBars();}
function drawDonut(){
  const c=$('#donut'); if(!c)return;
  const {ctx,w,h}=setupCanvas(c);
  const txm=txsOfMonth().filter(t=>t.type==='out');
  const byCat={}; txm.forEach(t=>byCat[t.catId]=(byCat[t.catId]||0)+t.amount);
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((a,e)=>a+e[1],0);
  const cx=w/2, cy=h/2, R=Math.min(w,h)/2-12, r=R*0.62;
  ctx.clearRect(0,0,w,h);
  if(total===0){
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.arc(cx,cy,r,0,7,true);ctx.fillStyle=cssVar('--card2');ctx.fill();
    ctx.fillStyle=cssVar('--text2');ctx.font='600 13px sans-serif';ctx.textAlign='center';ctx.fillText('Belum ada pengeluaran',cx,cy+4);
    $('#donutLegend').innerHTML='';return;
  }
  let a=-Math.PI/2;
  entries.forEach(([id,v])=>{
    const ang=v/total*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+ang);ctx.closePath();
    ctx.fillStyle=catById(id).color;ctx.fill();
    ctx.strokeStyle=cssVar('--card');ctx.lineWidth=2;ctx.stroke();
    a+=ang;
  });
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle=cssVar('--card');ctx.fill();
  ctx.fillStyle=cssVar('--text2');ctx.font='600 11px sans-serif';ctx.textAlign='center';ctx.fillText('TOTAL',cx,cy-10);
  ctx.fillStyle=cssVar('--text');ctx.font='800 15px sans-serif';ctx.fillText(fmtShort(total),cx,cy+10);
  $('#donutLegend').innerHTML=entries.slice(0,6).map(([id,v])=>{const c2=catById(id);
    return `<span><i class="dot" style="background:${c2.color}"></i>${c2.emoji} ${esc(c2.name)} · ${Math.round(v/total*100)}%</span>`;}).join('');
}
function drawBars(){
  const c=$('#bars'); if(!c)return;
  const {ctx,w,h}=setupCanvas(c);
  ctx.clearRect(0,0,w,h);
  const months=[];
  for(let i=5;i>=0;i--){const d=new Date(cur.y,cur.m-i,1);months.push({key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,label:d.toLocaleDateString('id-ID',{month:'short'})});}
  const data=months.map(m=>{const txs=state.txs.filter(t=>t.date.startsWith(m.key));
    return{...m,inc:sum(txs.filter(t=>t.type==='in')),out:sum(txs.filter(t=>t.type==='out'))};});
  const max=Math.max(...data.map(d=>Math.max(d.inc,d.out)),1);
  const base=h-26, chartH=h-40, gw=w/6, bw=Math.min(16,gw*0.26);
  ctx.strokeStyle=cssVar('--line');ctx.setLineDash([4,4]);
  for(let i=0;i<=3;i++){const y=base-chartH*i/3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.setLineDash([]);
  data.forEach((d,i)=>{
    const x=gw*i+gw/2;
    const hi=d.inc/max*chartH, ho=d.out/max*chartH;
    ctx.fillStyle=cssVar('--green');roundRect(ctx,x-bw-2,base-hi,bw,hi);
    ctx.fillStyle=cssVar('--red');roundRect(ctx,x+2,base-ho,bw,ho);
    ctx.fillStyle=cssVar('--text2');ctx.font='600 10px sans-serif';ctx.textAlign='center';ctx.fillText(d.label,x,h-8);
  });
}
function roundRect(ctx,x,y,w,h){if(h<1)return;const r=Math.min(4,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,0);ctx.arcTo(x,y+h,x,y,0);ctx.arcTo(x,y,x+w,y,r);ctx.fill();}
window.addEventListener('resize',()=>{if(activeTab==='home')drawCharts();});

function txRow(t){
  const c=catById(t.catId), wl=walById(t.walletId);
  return `<button class="row-item" data-edit="${t.id}">
    <div class="avatar" style="background:${c.color}22">${c.emoji}</div>

    <div class="amt ${t.type}">${t.type==='in'?'+':'−'}${fmt(t.amount)}</div>
  </button>`;
}
function renderTxFilters(){
  const fc=$('#fCat'),fw=$('#fWallet');
  fc.innerHTML='<option value="">Semua Kategori</option>'+state.cats.map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)} (${c.type==='in'?'masuk':'keluar'})</option>`).join('');
  fw.innerHTML='<option value="">Semua Dompet</option>'+state.wallets.map(w=>`<option value="${w.id}">${w.emoji} ${esc(w.name)}</option>`).join('');
  fc.value=filters.cat;fw.value=filters.wallet;
}
function renderTx(){
  renderTxFilters();
  let list=txsOfMonth();
  if(filters.type)list=list.filter(t=>t.type===filters.type);
  if(filters.cat)list=list.filter(t=>t.catId===filters.cat);
  if(filters.wallet)list=list.filter(t=>t.walletId===filters.wallet);
  if(filters.q){const q=filters.q.toLowerCase();list=list.filter(t=>(t.note||'').toLowerCase().includes(q)||catById(t.catId).name.toLowerCase().includes(q)||walById(t.walletId).name.toLowerCase().includes(q));}
  list.sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  if(list.length===0){$('#txList').innerHTML='<div class="card empty"><div class="big-em">🔎</div>Tidak ada transaksi yang cocok.</div>';return;}
  const groups={};list.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  let html='';
  Object.keys(groups).sort().reverse().forEach(date=>{
    const g=groups[date];
    const dayNet=sum(g.filter(t=>t.type==='in'))-sum(g.filter(t=>t.type==='out'));
    const dLabel=new Date(date+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
    html+=`<div class="day-head"><span>${dLabel}</span><span class="${dayNet>=0?'':''}" style="color:${dayNet>=0?'var(--green)':'var(--red)'}">${dayNet>=0?'+':'−'}${fmt(Math.abs(dayNet))}</span></div>
    <div class="list">${g.map(txRow).join('')}</div>`;
  });
  $('#txList').innerHTML=html;
  $$('#txList [data-edit]').forEach(b=>b.onclick=()=>{const t=state.txs.find(x=>x.id===b.dataset.edit);t&&txModal(t);});
}
$('#fSearch').oninput=e=>{filters.q=e.target.value;renderTx();};

/* ================= STATISTIK ================= */
function renderStats(){
  const txm=txsOfMonth();
  const inc=sum(txm.filter(t=>t.type==='in')), out=sum(txm.filter(t=>t.type==='out'));
  const daysPassed=isCurMonth()?new Date().getDate():new Date(cur.y,cur.m+1,0).getDate();
  const avg=out/Math.max(1,daysPassed);
  const outs=txm.filter(t=>t.type==='out');
  const biggest=outs.length?outs.reduce((a,b)=>b.amount>a.amount?b:a):null;
  const byCat={};outs.forEach(t=>byCat[t.catId]=(byCat[t.catId]||0)+t.amount);
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  const count={};outs.forEach(t=>count[t.catId]=(count[t.catId]||0)+1);
  const freq=Object.entries(count).sort((a,b)=>b[1]-a[1])[0];
  const rate=inc>0?Math.round((inc-out)/inc*100):0;
  const card=(label,val,extra='')=>`<div class="card stat"><div class="muted">${label}</div><div class="val" style="font-size:1rem">${val}</div>${extra}</div>`;
  let html=`<div class="stat-grid">
    ${card('💹 Selisih bulan ini',`<span style="color:${inc-out>=0?'var(--green)':'var(--red)'}">${inc-out>=0?'+':'−'}${fmt(Math.abs(inc-out))}</span>`)}
    ${card('🐷 Tingkat hemat',rate+'%')}
    ${card('📅 Rata-rata/hari',fmt(Math.round(avg)))}
    ${card('🧾 Jumlah transaksi',txm.length+' transaksi')}
  </div>
  <div class="section-title">Highlight</div><div class="list">
    ${biggest?`<div class="row-item"><div class="avatar" style="background:${catById(biggest.catId).color}22">${catById(biggest.catId).emoji}</div>
      <div class="grow"><div class="t">Pengeluaran terbesar</div><div class="s">${esc(catById(biggest.catId).name)} · ${esc(biggest.note||'-')}</div></div><div class="amt out">−${fmt(biggest.amount)}</div></div>`:''}
    ${top?`<div class="row-item"><div class="avatar" style="background:${catById(top[0]).color}22">${catById(top[0]).emoji}</div>
      <div class="grow"><div class="t">Kategori terboros</div><div class="s">${esc(catById(top[0]).name)} · ${Math.round(top[1]/Math.max(1,out)*100)}% dari total</div></div><div class="amt out">−${fmt(top[1])}</div></div>`:''}
    ${freq?`<div class="row-item"><div class="avatar" style="background:${catById(freq[0]).color}22">${catById(freq[0]).emoji}</div>
      <div class="grow"><div class="t">Paling sering jajan</div><div class="s">${esc(catById(freq[0]).name)}</div></div><div class="amt">${freq[1]}x</div></div>`:''}
  </div>
  <div class="section-title">Saldo per Dompet</div><div class="list">
    ${state.wallets.map(w=>{const bal=sum(state.txs.filter(t=>t.walletId===w.id&&t.type==='in'))-sum(state.txs.filter(t=>t.walletId===w.id&&t.type==='out'));
      return `<div class="row-item" style="cursor:default"><div class="avatar" style="background:${w.color}22">${w.emoji}</div>
      <div class="grow"><div class="t">${esc(w.name)}</div></div><div class="amt ${bal>=0?'in':'out'}">${fmt(bal)}</div></div>`;}).join('')}
  </div>`;
  $('#statsContent').innerHTML=html;
}

  $('#expJson').onclick=exportJSON; $('#impJson').onclick=()=>$('#importFile').click();
  $('#expCsv').onclick=exportCSV; $('#sampleBtn').onclick=()=>confirmBox('Muat data contoh? Data transaksi saat ini akan diganti.',loadSample);
  $('#resetBtn').onclick=()=>confirmBox('Yakin hapus SEMUA data? Tidak bisa dibatalkan!',()=>{state=defaultState();applyTheme();save();renderAll();toast('🔄 Data direset');});
  $$('[data-dw]').forEach(b=>b.onclick=()=>confirmBox('Hapus dompet ini?',()=>{state.wallets=state.wallets.filter(w=>w.id!==b.dataset.dw);save();renderAll();toast('Dompet dihapus');}));
  $$('[data-dc]').forEach(b=>b.onclick=()=>confirmBox('Hapus kategori ini?',()=>{state.cats=state.cats.filter(c=>c.id!==b.dataset.dc);save();renderAll();toast('Kategori dihapus');}));
}

/* ================= EXPORT / IMPORT ================= */
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();}
function exportJSON(){download(`dompetku-backup-${ymd(new Date())}.json`,JSON.stringify(state,null,2),'application/json');toast('📤 Backup diunduh');}
function exportCSV(){
  const rows=[['Tanggal','Tipe','Kategori','Dompet','Jumlah','Catatan']];
  [...state.txs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,t.type==='in'?'Pemasukan':'Pengeluaran',catById(t.catId).name,walById(t.walletId).name,t.amount,(t.note||'').replace(/;/g,',')]));
  download(`dompetku-${ymd(new Date())}.csv`,'\uFEFF'+rows.map(r=>r.join(';')).join('\n'),'text/csv');toast('📄 CSV diunduh');
}
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);
    if(!s.txs||!s.wallets||!s.cats)throw 0;
    confirmBox('Import backup akan MENGGANTI semua data saat ini. Lanjut?',()=>{state=s;applyTheme();save();renderAll();toast('📥 Backup dipulihkan');});
  }catch(err){toast('❌ File tidak valid');}};
  r.readAsText(f);e.target.value='';
});

/* ================= DATA CONTOH ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function loadSample(){
  const rnd=mulberry32(7), txs=[], today=new Date();
  const ri=(min,max)=>Math.round((min+rnd()*(max-min))/1000)*1000;
  for(let k=2;k>=0;k--){
    const base=new Date(today.getFullYear(),today.getMonth()-k,1);
    const dim=k===0?today.getDate():new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
    const D=()=>pad(Math.min(dim,1+Math.floor(rnd()*dim)));
    const add=(day,type,catId,amount,walletId,note)=>txs.push({id:uid(),type,catId,walletId,date:`${base.getFullYear()}-${pad(base.getMonth()+1)}-${day}`,amount,note,created:Date.now()-Math.floor(rnd()*1e8)});
    add('01','in','salary',5200000,'bank','Gaji bulanan');
    add(pad(Math.min(dim,3)),'out','bills',ri(200000,300000),'bank','Listrik');
    add(pad(Math.min(dim,5)),'out','bills',300000,'bank','Internet rumah');
    for(let i=0;i<16;i++)add(D(),'out','food',ri(15000,65000),rnd()>.5?'cash':'ewallet',['Makan siang','Kopi','GoFood','Makan malam','Sarapan'][Math.floor(rnd()*5)]);
    for(let i=0;i<7;i++)add(D(),'out','transport',ri(10000,40000),'ewallet',['Bensin','Gojek','Parkir','KRL'][Math.floor(rnd()*4)]);
    for(let i=0;i<3;i++)add(D(),'out','shopping',ri(80000,350000),rnd()>.5?'ewallet':'bank','Belanja online');
    for(let i=0;i<4;i++)add(D(),'out','fun',ri(35000,180000),'ewallet',['Bioskop','Langganan streaming','Game','Nongkrong'][Math.floor(rnd()*4)]);
    if(rnd()>.5)add(D(),'out','health',ri(25000,120000),'cash','Apotek');
    if(rnd()>.6)add(D(),'out','sport',ri(50000,150000),'ewallet','Gym / badminton');
    if(rnd()>.4)add(D(),'in','bonus',ri(200000,900000),'bank','Freelance');
  }
  state.txs=txs;
  state.budgets={food:1500000,transport:500000,shopping:800000,bills:700000,fun:500000};
  save();renderAll();toast('✨ Data contoh dimuat');
}

applyTheme();renderAll();

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Premium dengan Auth ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before, body::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        body::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
            animation-direction: reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        /* ========== AUTH PAGE ========== */
        .auth-container {
            position: relative;
            width: 380px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px 30px;
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            animation: slideIn 0.8s ease-out;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .auth-container.hidden {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
            position: absolute;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-logo-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .auth-title {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* Tab Switcher */
        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
        }

        /* Form */
        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
        }

        .toggle-password:hover {
            color: #fff;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Guest Button */
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .divider span {
            padding: 0 15px;
        }

        .btn-guest {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-guest:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 25px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .notification.success {
            background: rgba(52, 199, 89, 0.9);
        }

        .notification.error {
            background: rgba(255, 59, 48, 0.9);
        }

        .notification.info {
            background: rgba(0, 122, 255, 0.9);
        }

        /* ========== CALCULATOR (sama seperti sebelumnya + user info) ========== */
        .app-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: absolute;
        }

        .app-container.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
            position: relative;
        }

        .calculator {
            position: relative;
            width: 340px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideIn 0.8s ease-out;
        }

        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9f0a, #ff6b35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .user-avatar.guest {
            background: linear-gradient(135deg, #a5a5a5, #6c6c6c);
        }

        .user-details {
            min-width: 0;
            flex: 1;
        }

        .user-name {
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .user-role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.7rem;
        }

        .btn-logout {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.4);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .btn-logout:hover {
            background: rgba(255, 59, 48, 0.4);
            transform: scale(1.1);
        }

        .history-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }

        .history-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .history-toggle.active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
        }

        .history-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff3b30;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .history-badge.hidden {
            display: none;
        }

        .display {
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 2.8rem;
            font-weight: 300;
            text-align: right;
            padding: 25px 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            min-height: 100px;
            word-wrap: break-word;
            word-break: break-all;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            box-shadow: 
                inset 0 2px 10px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .display.active {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 1.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }

        .btn:active {
            transform: translateY(1px) scale(0.95);
            filter: brightness(0.9);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .btn:active::after {
            width: 200px;
            height: 200px;
            opacity: 0;
        }

        .btn.num {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn.func {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        .btn.op {
            background: linear-gradient(135deg, #ff9f0a, #ff6b35);
            color: #fff;
            font-size: 1.8rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 159, 10, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn.equals {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn.zero {
            grid-column: span 2;
            width: 100%;
            border-radius: 35px;
            text-align: left;
            padding-left: 28px;
        }

        /* ========== HISTORY PANEL ========== */
        .history-panel {
            position: relative;
            width: 0;
            max-height: 600px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            overflow: hidden;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        padding 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.3s ease;
            opacity: 0;
        }

        .history-panel.open {
            width: 300px;
            padding: 25px;
            opacity: 1;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            white-space: nowrap;
        }

        .history-title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .clear-history {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.4);
            color: #fff;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .clear-history:hover {
            background: rgba(255, 59, 48, 0.4);
            transform: scale(1.05);
        }

        .history-list {
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.4); border-radius: 3px; }

        .history-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: itemSlideIn 0.4s ease-out;
        }

        @keyframes itemSlideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-5px);
        }

        .history-expression {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .history-result {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: right;
            word-break: break-all;
        }

        .history-time {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.7rem;
            text-align: right;
            margin-top: 4px;
        }

        .history-empty {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
        }

        .history-empty-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 750px) {
            .app-container { flex-direction: column; }
            .history-panel.open { width: 340px; max-height: 400px; }
        }

        @media (max-width: 400px) {
            .auth-container, .calculator, .history-panel.open {
                width: 90vw;
                padding: 20px;
            }
            .btn { width: 60px; height: 60px; font-size: 1.3rem; }
            .display { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- ========== AUTH PAGE ========== -->
    <div class="auth-container" id="authContainer">
        <div class="auth-logo">
            <div class="auth-logo-icon">🧮</div>
            <div class="auth-title">Kalkulator Premium</div>
            <div class="auth-subtitle">Masuk untuk menyimpan riwayatmu</div>
        </div>

        <!-- Tab Switcher -->
        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Login</div>
            <div class="auth-tab" data-tab="register">Register</div>
        </div>

        <!-- Form Login -->
        <form class="auth-form active" id="loginForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="loginUsername" placeholder="Masukkan username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="form-input-wrapper">
                    <input type="password" class="form-input" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" data-target="loginPassword">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Masuk</button>
        </form>

        <!-- Form Register -->
        <form class="auth-form" id="registerForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="registerUsername" placeholder="Buat username (min 3 karakter)" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="form-input-wrapper">
                    <input type="password" class="form-input" id="registerPassword" placeholder="Buat password (min 4 karakter)" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="registerPassword">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Konfirmasi Password</label>
                <div class="form-input-wrapper">
                    <input type="password" class="form-input" id="registerConfirm" placeholder="Ulangi password" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="registerConfirm">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Daftar</button>
        </form>

        <div class="divider"><span>atau</span></div>
        <button class="btn-guest" id="guestBtn">👤 Lanjutkan sebagai Guest</button>
    </div>

    <!-- ========== CALCULATOR APP ========== -->
    <div class="app-container" id="appContainer">
        <div class="calculator">
            <div class="calc-header">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Guest</div>
                        <div class="user-role" id="userRole">Mode Tamu</div>
                    </div>
                </div>
                <button class="btn-logout" id="logoutBtn" title="Logout">🚪</button>
                <button class="history-toggle" id="historyToggle" title="Riwayat">
                    🕒
                    <span class="history-badge hidden" id="historyBadge">0</span>
                </button>
            </div>
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="btn func" data-action="clear">C</button>
                <button class="btn func" data-action="delete">DEL</button>
                <button class="btn func" data-action="percent">%</button>
                <button class="btn op" data-action="operator">/</button>
                
                <button class="btn num" data-action="number">7</button>
                <button class="btn num" data-action="number">8</button>
                <button class="btn num" data-action="number">9</button>
                <button class="btn op" data-action="operator">*</button>
                
                <button class="btn num" data-action="number">4</button>
                <button class="btn num" data-action="number">5</button>
                <button class="btn num" data-action="number">6</button>
                <button class="btn op" data-action="operator">-</button>
                
                <button class="btn num" data-action="number">1</button>
                <button class="btn num" data-action="number">2</button>
                <button class="btn num" data-action="number">3</button>
                <button class="btn op" data-action="operator">+</button>
                
                <button class="btn num zero" data-action="number">0</button>
                <button class="btn num" data-action="decimal">.</button>
                <button class="btn op equals" data-action="equals">=</button>
            </div>
        </div>

        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <div class="history-title">📜 RIWAYAT</div>
                <button class="clear-history" id="clearHistory">Hapus Semua</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script>
        // ========== AUTH SYSTEM ==========
        const DB_USERS = 'calcUsers';
        const DB_CURRENT = 'calcCurrentUser';
        const DB_GUEST = 'calcGuestHistory';

        let currentUser = null; // null = guest, string = username
        let currentInput = '0';
        let lastAction = '';

        // Helper: Load/Save users database
        function getUsers() {
            return JSON.parse(localStorage.getItem(DB_USERS)) || [];
        }

        function saveUsers(users) {
            localStorage.setItem(DB_USERS, JSON.stringify(users));
        }

        // Helper: Get current user data
        function getCurrentUserData() {
            if (!currentUser) return null;
            const users = getUsers();
            return users.find(u => u.username === currentUser);
        }

        // Helper: Update current user data
        function updateCurrentUser(userData) {
            const users = getUsers();
            const index = users.findIndex(u => u.username === currentUser);
            if (index !== -1) {
                users[index] = userData;
                saveUsers(users);
            }
        }

        // ========== NOTIFICATION ==========
        function showNotification(message, type = 'info') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = `notification ${type} show`;
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        // ========== AUTH UI ==========
        const authContainer = document.getElementById('authContainer');
        const appContainer = document.getElementById('appContainer');

        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}Form`).classList.add('active');
            });
        });

        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                input.type = input.type === 'password' ? 'text' : 'password';
                btn.textContent = input.type === 'password' ? '👁️' : '🙈';
            });
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;

            if (username.length < 3) {
                showNotification('Username minimal 3 karakter', 'error');
                return;
            }
            if (password.length < 4) {
                showNotification('Password minimal 4 karakter', 'error');
                return;
            }
            if (password !== confirm) {
                showNotification('Password tidak cocok!', 'error');
                return;
            }

            const users = getUsers();
            if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                showNotification('Username sudah terdaftar!', 'error');
                return;
            }

            users.push({
                username: username,
                password: password, // ⚠️ DEMO ONLY - jangan pakai plain text di production!
                history: []
            });
            saveUsers(users);

            showNotification('Registrasi berhasil! Silakan login', 'success');
            document.getElementById('registerForm').reset();
            document.querySelector('[data-tab="login"]').click();
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const users = getUsers();
            const user = users.find(u => u.username === username && u.password === password);

            if (!user) {
                showNotification('Username atau password salah!', 'error');
                return;
            }

            currentUser = user.username;
            localStorage.setItem(DB_CURRENT, currentUser);
            showNotification(`Selamat datang, ${user.username}! 👋`, 'success');
            enterApp();
        });

        // Guest
        document.getElementById('guestBtn').addEventListener('click', () => {
            currentUser = null;
            localStorage.removeItem(DB_CURRENT);
            showNotification('Masuk sebagai Guest 👤', 'info');
            enterApp();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Yakin ingin logout?')) {
                localStorage.removeItem(DB_CURRENT);
                currentUser = null;
                currentInput = '0';
                showNotification('Berhasil logout', 'info');
                exitApp();
            }
        });

        // ========== APP TRANSITIONS ==========
        function enterApp() {
            authContainer.classList.add('hidden');
            setTimeout(() => {
                appContainer.classList.add('visible');
                updateUserUI();
                loadHistory();
                renderHistory();
            }, 300);
        }

        function exitApp() {
            appContainer.classList.remove('visible');
            setTimeout(() => {
                authContainer.classList.remove('hidden');
                document.getElementById('loginForm').reset();
                document.getElementById('registerForm').reset();
                currentInput = '0';
                updateDisplay();
            }, 300);
        }

        // ========== USER UI ==========
        function updateUserUI() {
            const avatar = document.getElementById('userAvatar');
            const name = document.getElementById('userName');
            const role = document.getElementById('userRole');

            if (currentUser) {
                avatar.textContent = currentUser.charAt(0).toUpperCase();
                avatar.classList.remove('guest');
                name.textContent = currentUser;
                role.textContent = '✨ Member';
            } else {
                avatar.textContent = '👤';
                avatar.classList.add('guest');
                name.textContent = 'Guest';
                role.textContent = 'Mode Tamu';
            }
        }

        // ========== HISTORY SYSTEM ==========
        function getHistory() {
            if (currentUser) {
                const user = getCurrentUserData();
                return user ? user.history : [];
            } else {
                return JSON.parse(localStorage.getItem(DB_GUEST)) || [];
            }
        }

        function saveHistoryData(history) {
            if (currentUser) {
                const user = getCurrentUserData();
                if (user) {
                    user.history = history;
                    updateCurrentUser(user);
                }
            } else {
                localStorage.setItem(DB_GUEST, JSON.stringify(history));
            }
        }

        function loadHistory() {
            // Reset display saat ganti user
            currentInput = '0';
            updateDisplay();
        }

        function addToHistory(expression, result) {
            const history = getHistory();
            const now = new Date();
            const time = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            
            history.unshift({ expression, result, time });
            if (history.length > 20) history.pop();
            
            saveHistoryData(history);
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const historyBadge = document.getElementById('historyBadge');
            const history = getHistory();

            if (history.length === 0) {
                historyList.innerHTML = `
                    <div class="history-empty">
                        <div class="history-empty-icon">📭</div>
                        <div>Belum ada riwayat perhitungan</div>
                    </div>
                `;
                historyBadge.classList.add('hidden');
            } else {
                historyList.innerHTML = history.map((item, index) => `
                    <div class="history-item" data-index="${index}">
                        <div class="history-expression">${item.expression}</div>
                        <div class="history-result">= ${item.result}</div>
                        <div class="history-time">${item.time}</div>
                    </div>
                `).join('');
                historyBadge.textContent = history.length;
                historyBadge.classList.remove('hidden');
            }
        }

        document.getElementById('historyToggle').addEventListener('click', () => {
            document.getElementById('historyPanel').classList.toggle('open');
            document.getElementById('historyToggle').classList.toggle('active');
        });

        document.getElementById('clearHistory').addEventListener('click', (e) => {
            e.stopPropagation();
            if (getHistory().length === 0) return;
            if (confirm('Hapus semua riwayat perhitungan?')) {
                saveHistoryData([]);
                renderHistory();
                showNotification('Riwayat dihapus', 'info');
            }
        });

        document.getElementById('historyList').addEventListener('click', (e) => {
            const item = e.target.closest('.history-item');
            if (item) {
                const index = parseInt(item.dataset.index);
                currentInput = getHistory()[index].result;
                updateDisplay();
            }
        });

        // ========== CALCULATOR LOGIC ==========
        const display = document.getElementById('display');

        function updateDisplay() {
            display.textContent = currentInput;
            display.classList.add('active');
            setTimeout(() => display.classList.remove('active'), 200);
            
            if (currentInput.length > 10) display.style.fontSize = '1.8rem';
            else if (currentInput.length > 7) display.style.fontSize = '2.2rem';
            else display.style.fontSize = '2.8rem';
        }

        document.querySelector('.buttons').addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') return;
            const action = e.target.dataset.action;
            const value = e.target.textContent;

            switch (action) {
                case 'number':
                    currentInput = currentInput === '0' ? value : currentInput + value;
                    break;
                case 'decimal':
                    if (!currentInput.includes('.')) currentInput += '.';
                    break;
                case 'operator':
                    const lastChar = currentInput.slice(-1);
                    if (['+', '-', '*', '/'].includes(lastChar)) {
                        currentInput = currentInput.slice(0, -1) + value;
                    } else {
                        currentInput += value;
                    }
                    break;
                case 'equals':
                    try {
                        const expression = currentInput;
                        let result = eval(currentInput).toString();
                        if (result.includes('.') && result.length > 12) {
                            result = parseFloat(result).toPrecision(8).toString();
                        }
                        if (result !== 'Error' && result !== expression) {
                            addToHistory(expression, result);
                        }
                        currentInput = result;
                    } catch {
                        currentInput = 'Error';
                    }
                    break;
                case 'clear':
                    currentInput = '0';
                    break;
                case 'delete':
                    currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
                    break;
                case 'percent':
                    try {
                        currentInput = (eval(currentInput) / 100).toString();
                    } catch {
                        currentInput = 'Error';
                    }
                    break;
            }
            lastAction = action;
            updateDisplay();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (authContainer.classList.contains('hidden')) {
                if (e.key >= '0' && e.key <= '9') {
                    document.querySelector('[data-action="number"]:not(.zero)').click();
                } else if (['+', '-', '*', '/'].includes(e.key)) {
                    const ops = ['/', '*', '-', '+'];
                    const idx = ops.indexOf(e.key);
                    document.querySelectorAll('[data-action="operator"]')[idx].click();
                } else if (e.key === 'Enter' || e.key === '=') {
                    document.querySelector('[data-action="equals"]').click();
                } else if (e.key === 'Escape') {
                    document.querySelector('[data-action="clear"]').click();
                } else if (e.key === 'Backspace') {
                    document.querySelector('[data-action="delete"]').click();
                } else if (e.key === 'h' || e.key === 'H') {
                    document.getElementById('historyToggle').click();
                }
            }
        });

        // ========== INIT ==========
        (function init() {
            const savedUser = localStorage.getItem(DB_CURRENT);
            if (savedUser) {
                const users = getUsers();
                if (users.some(u => u.username === savedUser)) {
                    currentUser = savedUser;
                    enterApp();
                    return;
                } else {
                    localStorage.removeItem(DB_CURRENT);
                }
            }
            updateDisplay();
        })();
    </script>
</body>
</html>

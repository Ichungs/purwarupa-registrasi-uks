<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Siswa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Sistem Presensi Digital</h1>
      <p>Tap kartu RFID Anda untuk melakukan presensi</p>
    </div>

    <nav class="nav">
      <a href="index.html" class="active">Kehadiran</a>
      <a href="admin.html">Admin</a>
    </nav>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total Siswa</div>
        <div class="value" id="totalSiswa">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Hadir Hari Ini</div>
        <div class="value" id="hadirHariIni">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Tanggal</div>
        <div class="value" id="tanggal" style="font-size: 1.2rem;">-</div>
      </div>
    </div>

    <!-- Daftar Kehadiran -->
    <div class="glass">
      <div class="glass-header">
        <h2>📝 Daftar Kehadiran Hari Ini</h2>
        <button class="btn btn-primary" onclick="loadKehadiran()">🔄 Refresh</button>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>Kelas</th>
              <th>Jam Hadir</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="kehadiranBody">
            <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

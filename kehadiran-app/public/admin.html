<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Presensi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Panel Admin</h1>
      <p>Kelola data presensi, foto, dan kesehatan siswa</p>
    </div>

    <nav class="nav">
      <a href="index.html">Kehadiran</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>

    <!-- Filter tanggal -->
    <div class="glass">
      <div class="glass-header">
        <h2>📅 Filter Tanggal</h2>
      </div>
      <div class="form-group">
        <input type="date" id="filterTanggal" onchange="loadAdminData()">
      </div>
    </div>

    <!-- Data Presensi Lengkap -->
    <div class="glass">
      <div class="glass-header">
        <h2>📊 Data Presensi Lengkap</h2>
        <span class="badge badge-info" id="countBadge">0 data</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>Kelas</th>
              <th>Jam Hadir</th>
              <th>Denyut Nadi</th>
              <th>SpO2</th>
              <th>Foto</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="adminBody">
            <tr><td colspan="8" style="text-align:center; color:#94a3b8;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Kelola Siswa -->
    <div class="glass">
      <div class="glass-header">
        <h2>👥 Kelola Data Siswa</h2>
        <button class="btn btn-primary" onclick="toggleFormSiswa()">+ Tambah Siswa</button>
      </div>

      <div id="formSiswa" style="display:none; margin-bottom: 1.5rem;">
        <div class="form-group">
          <label>UID RFID</label>
          <input type="text" id="inputUid" placeholder="Contoh: A1B2C3D4">
        </div>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="inputNama" placeholder="Nama siswa">
        </div>
        <div class="form-group">
          <label>Kelas</label>
          <input type="text" id="inputKelas" placeholder="Contoh: XII RPL 1">
        </div>
        <button class="btn btn-primary" onclick="tambahSiswa()">💾 Simpan</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>UID RFID</th>
              <th>Nama</th>
              <th>Kelas</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="siswaBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Detail -->
  <div class="modal" id="modalDetail">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <h2 id="modalNama" style="margin-bottom:1rem;"></h2>
      <div id="modalFoto"></div>
      <div id="modalDetail"></div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>

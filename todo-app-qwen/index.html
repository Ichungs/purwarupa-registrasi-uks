<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        /* ===== VARIABEL WARNA (LIGHT MODE) ===== */
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --input-text: #333333;
            --item-bg: #f9f9f9;
            --item-hover: #f0f0f0;
            --item-completed-bg: #e8e8e8;
            --item-completed-text: #999999;
            --empty-text: #aaaaaa;
            --stats-border: #eeeeee;
            --filter-bg: #f0f0f0;
            --filter-active-bg: #667eea;
            --filter-active-text: #ffffff;
            --filter-text: #555555;
            --badge-tinggi-bg: #ffe5e5;
            --badge-tinggi-text: #e74c3c;
            --badge-sedang-bg: #fff4d6;
            --badge-sedang-text: #f39c12;
            --badge-rendah-bg: #d9f7e8;
            --badge-rendah-text: #27ae60;
        }

        /* ===== VARIABEL WARNA (DARK MODE) ===== */
        body.dark {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --card-bg: #1e1e2e;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --input-bg: #2a2a3c;
            --input-border: #3a3a4c;
            --input-text: #e0e0e0;
            --item-bg: #2a2a3c;
            --item-hover: #333348;
            --item-completed-bg: #252536;
            --item-completed-text: #777788;
            --empty-text: #666677;
            --stats-border: #3a3a4c;
            --filter-bg: #2a2a3c;
            --filter-active-bg: #667eea;
            --filter-active-text: #ffffff;
            --filter-text: #cccccc;
            --badge-tinggi-bg: rgba(231, 76, 60, 0.2);
            --badge-tinggi-text: #ff7675;
            --badge-sedang-bg: rgba(243, 156, 18, 0.2);
            --badge-sedang-text: #fdcb6e;
            --badge-rendah-bg: rgba(39, 174, 96, 0.2);
            --badge-rendah-text: #55efc4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
            transition: background 0.3s ease;
        }

        .container {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 28px;
        }

        .theme-toggle {
            background: var(--item-bg);
            border: 2px solid var(--input-border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            background: var(--item-hover);
        }

        .icon-moon, .icon-sun {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-sun { display: none; }
        body.dark .icon-moon { display: none; }
        body.dark .icon-sun { display: flex; }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 150px;
            padding: 12px 15px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: var(--input-bg);
            color: var(--input-text);
            transition: border-color 0.3s, background-color 0.3s;
        }

        input[type="text"]:focus { border-color: #667eea; }
        input[type="text"]::placeholder { color: var(--empty-text); }

        #prioritySelect {
            padding: 12px 10px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--input-text);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s, background-color 0.3s;
        }

        button#addBtn {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button#addBtn:hover { background: #5a6fd6; }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }

        .filter-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: var(--filter-bg);
            color: var(--filter-text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover { opacity: 0.85; }

        .filter-btn.active {
            background: var(--filter-active-bg);
            color: var(--filter-active-text);
        }

        .priority-filter { display: flex; align-items: center; gap: 8px; }

        .priority-filter label { font-size: 14px; color: var(--text-secondary); }

        #priorityFilter {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--input-text);
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        ul { list-style: none; }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: var(--item-bg);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background-color 0.3s ease;
            gap: 10px;
        }

        li:hover { background: var(--item-hover); }

        /* ✅ Tugas selesai: hanya teks yang pudar & tercoret, tombol tetap jelas */
        li.completed { background: var(--item-completed-bg); }

        li.completed .task-text {
            text-decoration: line-through;
            color: var(--item-completed-text);
            opacity: 0.7;
        }

        .task-content {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 10px;
            min-width: 0;
        }

        .task-text {
            font-size: 16px;
            word-break: break-word;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .priority-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .priority-tinggi { background: var(--badge-tinggi-bg); color: var(--badge-tinggi-text); }
        .priority-sedang { background: var(--badge-sedang-bg); color: var(--badge-sedang-text); }
        .priority-rendah { background: var(--badge-rendah-bg); color: var(--badge-rendah-text); }

        .btn-group { display: flex; gap: 5px; flex-shrink: 0; }

        .done-btn {
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .done-btn:hover { background: #26b85f; }
        .done-btn.undo { background: #ffa502; }
        .done-btn.undo:hover { background: #e69500; }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .delete-btn:hover { background: #e84148; }

        .empty-msg {
            text-align: center;
            color: var(--empty-text);
            margin-top: 20px;
            font-style: italic;
        }

        .stats {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--stats-border);
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📋 To-Do List</h1>
        <button id="themeToggle" class="theme-toggle" title="Ganti Tema">
            <span class="icon-moon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
            <span class="icon-sun">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </span>
        </button>
    </div>
    
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Tambah tugas baru...">
        <select id="prioritySelect" title="Pilih Prioritas">
            <option value="tinggi">🔴 Tinggi</option>
            <option value="sedang" selected>🟡 Sedang</option>
            <option value="rendah">🟢 Rendah</option>
        </select>
        <button id="addBtn">Tambah</button>
    </div>
    
    <div class="filter-row">
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="active">Belum</button>
            <button class="filter-btn" data-filter="completed">Selesai</button>
        </div>
        <div class="priority-filter">
            <label for="priorityFilter">Prioritas:</label>
            <select id="priorityFilter">
                <option value="all">Semua</option>
                <option value="tinggi">🔴 Tinggi</option>
                <option value="sedang">🟡 Sedang</option>
                <option value="rendah">🟢 Rendah</option>
            </select>
        </div>
    </div>
    
    <ul id="taskList"></ul>
    <p id="emptyMsg" class="empty-msg">Belum ada tugas. Yuk mulai produktif!</p>
    <div id="stats" class="stats"></div>
</div>

<script>
    // ===== ELEMEN DOM =====
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const emptyMsg = document.getElementById('emptyMsg');
    const statsDiv = document.getElementById('stats');
    const themeToggle = document.getElementById('themeToggle');
    const prioritySelect = document.getElementById('prioritySelect');
    const priorityFilter = document.getElementById('priorityFilter');
    const filterBtns = document.querySelectorAll('.filter-btn');

    // ===== LOAD DATA DARI LOCALSTORAGE =====
    let tasks = JSON.parse(localStorage.getItem('todoTasks')) || [];

    // Migrasi data lama (jika ada task tanpa id/priority)
    tasks = tasks.map((task, index) => ({
        id: task.id || Date.now() + index,
        text: task.text || '',
        completed: task.completed || false,
        priority: task.priority || 'sedang'
    }));

    // ===== STATE FILTER =====
    let currentStatusFilter = 'all';
    let currentPriorityFilter = 'all';

    // ===== DARK MODE / LIGHT MODE =====
    const savedTheme = localStorage.getItem('todoTheme');
    if (savedTheme === 'dark') {
        document.body.classList.add('dark');
    }

    function updateThemeToggleTitle() {
        const isDark = document.body.classList.contains('dark');
        themeToggle.title = isDark ? 'Ganti ke Light Mode' : 'Ganti ke Dark Mode';
    }

    updateThemeToggleTitle();

    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const newTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
        localStorage.setItem('todoTheme', newTheme);
        updateThemeToggleTitle();
    });

    // ===== FUNGSI HELPERS =====
    function saveTasks() {
        localStorage.setItem('todoTasks', JSON.stringify(tasks));
    }

    function getPriorityLabel(priority) {
        const labels = {
            'tinggi': '🔴 Tinggi',
            'sedang': '🟡 Sedang',
            'rendah': '🟢 Rendah'
        };
        return labels[priority] || priority;
    }

    function getFilteredTasks() {
        return tasks.filter(task => {
            const statusMatch = 
                currentStatusFilter === 'all' ||
                (currentStatusFilter === 'completed' && task.completed) ||
                (currentStatusFilter === 'active' && !task.completed);
            
            const priorityMatch = 
                currentPriorityFilter === 'all' || task.priority === currentPriorityFilter;
            
            return statusMatch && priorityMatch;
        });
    }

    // ===== RENDER DAFTAR TUGAS =====
    function renderTasks() {
        const filteredTasks = getFilteredTasks();
        taskList.innerHTML = '';
        
        const completedCount = tasks.filter(t => t.completed).length;
        
        // Handle empty state
        if (tasks.length === 0) {
            emptyMsg.textContent = 'Belum ada tugas. Yuk mulai produktif!';
            emptyMsg.style.display = 'block';
            statsDiv.style.display = 'none';
        } else if (filteredTasks.length === 0) {
            emptyMsg.textContent = 'Tidak ada tugas yang cocok dengan filter.';
            emptyMsg.style.display = 'block';
            statsDiv.style.display = 'block';
        } else {
            emptyMsg.style.display = 'none';
            statsDiv.style.display = 'block';
        }
        
        filteredTasks.forEach(task => {
            const li = document.createElement('li');
            if (task.completed) li.classList.add('completed');
            
            const taskContent = document.createElement('div');
            taskContent.className = 'task-content';
            
            const badge = document.createElement('span');
            badge.className = `priority-badge priority-${task.priority}`;
            badge.textContent = getPriorityLabel(task.priority);
            
            const taskText = document.createElement('span');
            taskText.className = 'task-text';
            taskText.textContent = task.text;
            
            taskContent.appendChild(badge);
            taskContent.appendChild(taskText);
            
            const btnGroup = document.createElement('div');
            btnGroup.className = 'btn-group';
            
            const doneBtn = document.createElement('button');
            doneBtn.className = `done-btn ${task.completed ? 'undo' : ''}`;
            doneBtn.textContent = task.completed ? 'Batal' : 'Beres';
            doneBtn.addEventListener('click', () => toggleTask(task.id));
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = 'Hapus';
            deleteBtn.addEventListener('click', () => deleteTask(task.id));
            
            btnGroup.appendChild(doneBtn);
            btnGroup.appendChild(deleteBtn);
            
            li.appendChild(taskContent);
            li.appendChild(btnGroup);
            
            taskList.appendChild(li);
        });
        
        statsDiv.textContent = `Total: ${tasks.length} | Selesai: ${completedCount} | Belum: ${tasks.length - completedCount}`;
    }

    // ===== CRUD OPERATIONS =====
    function addTask() {
        const text = taskInput.value.trim();
        if (text === '') return alert('Tulis tugas terlebih dahulu!');
        
        const priority = prioritySelect.value;
        
        tasks.push({ 
            id: Date.now() + Math.floor(Math.random() * 1000), 
            text: text, 
            completed: false, 
            priority: priority 
        });
        saveTasks();
        renderTasks();
        taskInput.value = '';
        taskInput.focus();
    }

    function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            saveTasks();
            renderTasks();
        }
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        renderTasks();
    }

    // ===== EVENT LISTENERS =====
    addBtn.addEventListener('click', addTask);

    taskInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTask();
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentStatusFilter = btn.dataset.filter;
            renderTasks();
        });
    });

    priorityFilter.addEventListener('change', () => {
        currentPriorityFilter = priorityFilter.value;
        renderTasks();
    });

    // Render awal
    renderTasks();
</script>

</body>
</html>

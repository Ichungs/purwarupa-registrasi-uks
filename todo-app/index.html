<!DOCTYPE html>
<html>

<head>
<title>Todo App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>My Todo List</h1>

<div class="input-area">
<input id="taskInput" placeholder="Enter a task">
<button onclick="addTask()">Add</button>
</div>

<ul id="taskList"></ul>

<div class="filters">
<button onclick="filterTasks('all')">All</button>
<button onclick="filterTasks('active')">Active</button>
<button onclick="filterTasks('done')">Completed</button>
</div>

<div class="task-info">

<span id="taskCounter">0 tasks left</span>

<button onclick="clearCompleted()" class="clear-btn">
Clear Completed
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>

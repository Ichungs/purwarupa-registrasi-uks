<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="top-bar">
    <h1>💸 My Expense Tracker</h1>
    <button onclick="toggleDarkMode()" id="darkBtn">🌙</button>
  </div>

  <div class="balance">
    <h2>Balance</h2>
    <p id="balance">Rp0</p>
  </div>

  <div class="summary">
    <div class="income">
      <h3>Income</h3>
      <p id="income">Rp0</p>
    </div>
    <div class="expense">
      <h3>Expense</h3>
      <p id="expense">Rp0</p>
    </div>
  </div>

  <h3>Add Transaction</h3>
  <form>
    <input type="text" id="text" placeholder="Description" required>
    <input type="text" id="amount" placeholder="Amount" required>

    <div class="custom-select" onclick="toggleDropdown()">
      <div id="selected">Food</div>
      <div class="options" id="options">
        <div onclick="selectCategory('Food')">🍔 Food</div>
        <div onclick="selectCategory('Transport')">🚗 Transport</div>
        <div onclick="selectCategory('Shopping')">🛍️ Shopping</div>
        <div onclick="selectCategory('Bills')">💡 Bills</div>
        <div onclick="selectCategory('Other')">📦 Other</div>
      </div>
    </div>

    <div class="buttons">
      <button type="button" onclick="addTransactionType('income')" class="btn-income">+ Income</button>
      <button type="button" onclick="addTransactionType('expense')" class="btn-expense">- Expense</button>
    </div>
  </form>

  <div class="filters">
    <button onclick="setFilter('all')">All</button>
    <button onclick="setFilter('income')">Income</button>
    <button onclick="setFilter('expense')">Expense</button>
  </div>

  <h3>History</h3>
  <ul id="list"></ul>

  <h3>Chart</h3>
  <canvas id="myChart"></canvas>

  <button onclick="exportCSV()" class="export-btn">📥 Export CSV</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
